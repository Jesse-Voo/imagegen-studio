<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self'; script-src 'self'; font-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageGen Studio</title>
<link rel="stylesheet" href="../../node_modules/@picocss/pico/css/pico.zinc.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="title">ImageGen Studio</span>
  <button id="settingsBtn" class="plain" aria-label="Settings" title="Settings"><i data-lucide="settings"></i></button>
</header>

<main id="scroller">
  <div id="empty" class="empty"><i data-lucide="image"></i><h2>What should we make?</h2></div>
  <div id="feed"></div>
</main>

<section class="dock">
  <div id="status" class="status" role="status"></div>

  <div id="options" class="pop" hidden>
    <label>Image source <select id="backend"></select></label>
    <label>Model <input id="model" list="models" placeholder="default"><datalist id="models"></datalist></label>
    <p id="srcNote" class="hint" hidden></p>
    <div id="keyWarn" class="warn" hidden><i data-lucide="key-round"></i><span></span></div>
    <div class="seg" id="sizeSeg" role="group" aria-label="Image shape">
      <button type="button" data-size="square" aria-pressed="true"><i data-lucide="square"></i>Square</button>
      <button type="button" data-size="landscape" class="secondary outline" aria-pressed="false"><i data-lucide="rectangle-horizontal"></i>Wide</button>
      <button type="button" data-size="portrait" class="secondary outline" aria-pressed="false"><i data-lucide="rectangle-vertical"></i>Tall</button>
    </div>
    <div class="stepper">
      <span>How many</span>
      <div><button type="button" id="minus" class="secondary outline" aria-label="Fewer"><i data-lucide="minus"></i></button><output id="count">1</output><button type="button" id="plus" class="secondary outline" aria-label="More"><i data-lucide="plus"></i></button></div>
    </div>
    <p id="refNote" class="hint" hidden>This source ignores reference images.</p>
    <label><input id="refineOn" type="checkbox" role="switch"> Refine my prompt with AI first</label>
    <div id="refineOpts" hidden>
      <label>Refine with <select id="refiner"></select></label>
      <label>Refiner model <input id="refModel" placeholder="default"></label>
    </div>
  </div>

  <div class="composer">
    <div id="refs" class="thumbs"></div>
    <textarea id="prompt" placeholder="Describe an image" rows="1" aria-label="Image description"></textarea>
    <div class="bar">
      <button id="addRef" class="plain round" aria-label="Add reference image" title="Add reference image"><i data-lucide="plus"></i></button>
      <button id="refineBtn" class="plain round" aria-label="Refine prompt" title="Refine prompt with AI"><i data-lucide="wand-sparkles"></i></button>
      <button id="optBtn" class="plain round" aria-label="Options" title="Source, size and count" aria-expanded="false"><i data-lucide="sliders-horizontal"></i></button>
      <span class="grow"></span>
      <button id="stop" class="send stopbtn" aria-label="Cancel" title="Cancel" hidden><i data-lucide="square"></i></button>
      <button id="go" class="send" aria-label="Generate" title="Generate (Ctrl+Enter)"><i data-lucide="arrow-up"></i></button>
    </div>
  </div>
</section>

<div id="lightbox" hidden><img id="lbImg" alt="Generated image, enlarged"><button id="lbClose" class="plain round" aria-label="Close"><i data-lucide="x"></i></button></div>

<dialog id="dlg">
  <article>
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>
      <label>Save images to
        <div class="row"><input id="outDir" readonly><button type="button" id="pickOut" class="secondary outline"><i data-lucide="folder-open"></i>Browse</button></div>
      </label>
      <label>Gemini API key <input id="geminiKey" type="password" autocomplete="off" placeholder="leave blank to keep the saved key"></label>
      <label>OpenAI API key <input id="openaiKey" type="password" autocomplete="off" placeholder="leave blank to keep the saved key"></label>
      <p class="hint">Keys are encrypted with Windows (DPAPI) and stored on this PC only. Environment variables GEMINI_API_KEY and OPENAI_API_KEY also work. ChatGPT sign-in cannot generate images; OpenAI needs an API key.</p>
      <label>Local image server URL <input id="localUrl" placeholder="http://127.0.0.1:8080/v1"></label>
      <label>Ollama URL <input id="ollamaUrl" placeholder="http://127.0.0.1:11434"></label>
      <div class="row">
        <button type="button" id="clearGemini" class="secondary outline"><i data-lucide="trash-2"></i>Remove Gemini key</button>
        <button type="button" id="clearOpenai" class="secondary outline"><i data-lucide="trash-2"></i>Remove OpenAI key</button>
      </div>
      <footer class="actions"><span class="grow"></span><button value="cancel" class="secondary">Close</button><button id="saveSettings" value="save">Save</button></footer>
    </form>
  </article>
</dialog>
<script src="../../node_modules/lucide/dist/umd/lucide.min.js"></script>
<script src="../../node_modules/motion/dist/motion.js"></script>
<script src="app.js"></script>
</body>
</html>
